# Cau hinh test runner - Sprint 8
#
# Nguyen tac: `pytest` chay tay khong doi hoi gi ca. Khong can YOLO, khong can
# PostgreSQL, khong can webcam, va **khong duoc de lai dau vet** (khong ghi de
# model, khong tao du lieu that).
#
# Cac script can moi truong that nam trong `test/manual/` va bi loai khoi pham vi
# thu gom o duoi.

[pytest]

# Chi thu gom trong `test/`. `test/manual/` bi loai o `norecursedirs`.
testpaths = test

norecursedirs =
    test/manual
    .venv
    .git
    __pycache__
    models
    dataset
    docs
    assets
    logs

python_files = test_*.py
python_classes = *Test
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -q

markers =
    slow: test chay lau hon 1 giay
    integration: test tich hop nhieu tang that (khong dung fake)

# Tat log rac cua thu vien ben thu ba khi chay test.
log_cli = false
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
